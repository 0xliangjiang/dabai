services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6543:3001"
    env_file:
      - server/.env.production
    environment:
      - NODE_ENV=production
      # 容器内固定监听 3001（覆盖 env 文件里的 PORT），对外端口只由上面的 ports 映射决定
      - PORT=3001
      - UPLOAD_DIR=/app/server/uploads
      - CORS_ORIGINS=http://43.134.117.111:3666,https://dabai.discordbot.cn:3666,https://dabai.discordbot.cn
      - ORDER_SYNC_INTERVAL_MINUTES=2
      # 单实例 API 使用保守连接池，避免低 max_connections 的 MySQL 被 Prisma 默认池打满
      - DB_CONNECTION_LIMIT=${DB_CONNECTION_LIMIT:-5}
      - DB_POOL_TIMEOUT_SECONDS=${DB_POOL_TIMEOUT_SECONDS:-10}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-10}
      - DB_MIGRATION_MAX_ATTEMPTS=${DB_MIGRATION_MAX_ATTEMPTS:-6}
    volumes:
      - ./deploy-data/uploads:/app/server/uploads

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        # 管理后台访问的 API 地址（构建时注入），生产填 https://api.你的域名
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-https://dabai.discordbot.cn}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3666:80"
    depends_on:
      - api
