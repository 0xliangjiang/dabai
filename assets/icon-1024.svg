<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11a673"/>
      <stop offset="0.5" stop-color="#0a7a52"/>
      <stop offset="1" stop-color="#07543c"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.85" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#e8c476" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#e8c476" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGr" cx="0.1" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbf0d4"/>
      <stop offset="0.45" stop-color="#e8c476"/>
      <stop offset="1" stop-color="#caa047"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#0b6647"/>
      <stop offset="1" stop-color="#064a34"/>
    </radialGradient>
  </defs>

  <!-- 背景：祖母绿渐变 + 双光晕（与首页 hero 一致） -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glowG)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glowGr)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10"/>

  <!-- 香槟金勋章环 -->
  <circle cx="512" cy="512" r="296" fill="url(#disc)"/>
  <circle cx="512" cy="512" r="296" fill="none" stroke="url(#gold)" stroke-width="30"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>

  <!-- 金色闪电（呼应「捷径」） -->
  <path d="M556 320 L402 556 L492 556 L468 712 L626 468 L534 468 Z"
    fill="url(#gold)" stroke="#b78a3c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M556 320 L470 452 L520 452 Z" fill="#ffffff" fill-opacity="0.28"/>
</svg>
