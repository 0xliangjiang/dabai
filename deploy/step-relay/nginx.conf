server {
    listen 80;
    listen [::]:80;
    server_name 49.235.155.175.sslip.io;

    access_log off;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 49.235.155.175.sslip.io;

    ssl_certificate /etc/nginx/step-relay/tls.crt;
    ssl_certificate_key /etc/nginx/step-relay/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
    }

    location = /api/xiaomisport {
        allow 43.134.117.111;
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location / {
        return 404;
    }
}

# Plain HTTP fallback used only by the production API. Access to the relay
# endpoint remains restricted by source IP and a shared token.
server {
    listen 9443;
    server_name 49.235.155.175 49.235.155.175.sslip.io;

    access_log off;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
    }

    location = /api/xiaomisport {
        allow 43.134.117.111;
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location / {
        return 404;
    }
}
