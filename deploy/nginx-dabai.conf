# 大白小助手 Nginx 站点配置（单域名：/api 走后端，其余走管理后台）
# 用法：复制到 /etc/nginx/sites-available/dabai.conf 并软链到 sites-enabled
server {
    listen 443 ssl;
    server_name dabai.discordbot.cn;

    ssl_certificate     /etc/letsencrypt/live/dabai.discordbot.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dabai.discordbot.cn/privkey.pem;

    client_max_body_size 60m;   # 线报视频上传

    # API + 上传文件 + 健康检查 → api 容器
    location ~ ^/(api|uploads|health) {
        proxy_pass http://127.0.0.1:6543;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 → 管理后台容器
    location / {
        proxy_pass http://127.0.0.1:3666;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name dabai.discordbot.cn;
    return 301 https://$host$request_uri;
}
